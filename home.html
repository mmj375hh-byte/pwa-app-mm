<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Workout Log PWA</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org' viewBox='0 0 512 512' width='512' height='512'><rect width='512' height='512' rx='100' fill='%23ff5722'/><circle cx='256' cy='256' r='120' fill='%23ffffff'/><rect x='206' y='206' width='100' height='100' fill='%23ff5722'/></svg>">
    
    <!-- ローカルライブラリ・CSSの読み込み -->
    <link href="css/lib/bootstrap.min.css" rel="stylesheet">
    <link href="css/home.css" rel="stylesheet" >

    <script src="js/lib/dexie.min.js"></script>
    <script src="js/lib/chart.umd.min.js"></script>
    <script src="js/lib/bootstrap.min.js"></script>
</head>
<body>
    <!-- メインコンテナ（スマホ幅に最適化） -->
    <div class="container-sm py-4">
        
        <!-- ヘッダーエリア（右端にメニューを開く三本線ボタンを配置） -->
        <div class="d-flex align-items-center justify-content-between mb-4">
            <div class="d-flex align-items-center">
                <div class="header-icon bg-danger text-white rounded-3 p-2 me-3 d-flex align-items-center justify-content-center">
                    🏋️
                </div>
                <h1 class="h3 mb-0 fw-bold">Workout Log</h1>
            </div>
            <!-- ☰ ハンバーガーメニューを開くボタン（横からヌルッと出ます） -->
            <button class="btn btn-light border shadow-sm rounded-3 py-2 px-3 text-secondary" type="button" data-bs-toggle="offcanvas" data-bs-target="#menuOffcanvas" aria-controls="menuOffcanvas">
                ☰
            </button>
        </div>
        
        <!-- 1. 入力フォームエリア -->
        <div class="card border-0 shadow-sm rounded-4 p-3 mb-4">
            <div class="mb-3">
                <label class="form-label small fw-bold text-muted">トレーニング日</label>
                <input type="date" id="date-input" class="form-control form-control-lg rounded-3">
            </div>

            <div class="mb-3">
                <label class="form-label small fw-bold text-muted">種目</label>
                <select id="exercise-select" class="form-select form-select-lg rounded-3">
                    <option value="Bench Press">ベンチプレス</option>
                    <option value="Squat">スクワット</option>
                    <option value="Deadlift">デッドリフト</option>
                </select>
            </div>

            <!-- 重量と回数の入力 ＋ クイック増減ボタン -->
            <div class="row g-2 mb-3">
                <!-- 重量（kg）の増減 -->
                <div class="col-6">
                    <label class="form-label small fw-bold text-muted">重量</label>
                    <div class="input-group input-group-lg mb-2">
                        <input type="number" id="weight-input" class="form-control rounded-3" placeholder="0" inputmode="decimal">
                        <span class="input-group-text bg-light text-muted font-monospace small">kg</span>
                    </div>
                    <div class="d-flex flex-wrap gap-1">
                        <button class="btn btn-light btn-sm flex-fill border text-muted fw-bold" onclick="adjustValue('weight', -10)">-10</button>
                        <button class="btn btn-light btn-sm flex-fill border text-muted fw-bold" onclick="adjustValue('weight', -5)">-5</button>
                        <button class="btn btn-light btn-sm flex-fill border text-muted fw-bold" onclick="adjustValue('weight', -2.5)">-2.5</button>
                        <button class="btn btn-light btn-sm flex-fill border text-muted fw-bold" onclick="adjustValue('weight', 2.5)">+2.5</button>
                        <button class="btn btn-light btn-sm flex-fill border text-muted fw-bold" onclick="adjustValue('weight', 5)">+5</button>
                    </div>
                </div>

                <!-- 回数（Reps）の増減 -->
                <div class="col-6">
                    <label class="form-label small fw-bold text-muted">回数</label>
                    <div class="input-group input-group-lg mb-2">
                        <input type="number" id="reps-input" class="form-control rounded-3" placeholder="0" inputmode="numeric">
                        <span class="input-group-text bg-light text-muted font-monospace small">Reps</span>
                    </div>
                    <div class="d-flex flex-wrap gap-1">
                        <button class="btn btn-light btn-sm flex-fill border text-muted fw-bold" onclick="adjustValue('reps', -2)">-2</button>
                        <button class="btn btn-light btn-sm flex-fill border text-muted fw-bold" onclick="adjustValue('reps', -1)">-1</button>
                        <button class="btn btn-light btn-sm flex-fill border text-muted fw-bold" onclick="adjustValue('reps', 1)">+1</button>
                        <button class="btn btn-light btn-sm flex-fill border text-muted fw-bold" onclick="adjustValue('reps', 2)">+2</button>
                    </div>
                </div>
            </div>
            <button class="btn btn-danger btn-lg w-100 fw-bold rounded-3 shadow-sm" onclick="addRecord()">記録を保存</button>
        </div>

        <!-- 2. グラフ全画面表示ボタン -->
        <div class="mb-4">
            <button class="btn btn-primary btn-lg w-100 fw-bold rounded-3 shadow-sm py-3" onclick="openChartModal()">
                📈 グラフを全画面表示
            </button>
        </div>

        <!-- 3. メイン画面側の簡易履歴（直近5件のみを制限表示） -->
        <div class="mb-4">
            <h5 class="fw-bold mb-3 text-dark">Recent Activity</h5>
            <!-- JavaScriptでここに最新5件が自動生成されます -->
            <div id="recent-history-container" class="d-flex flex-column gap-2 mb-3"></div>
            
            <!-- 全履歴・フィルター画面を起動するボタン -->
            <button class="btn btn-outline-secondary w-100 fw-bold rounded-3 py-2" onclick="openHistoryModal()">
                📋 すべての履歴・フィルター表示
            </button>
        </div>

    </div> <!-- メインコンテナ終了 -->

    <!-- ==========================================
    4. ハンバーガーメニュー（データ管理をスッキリ収納）
    ========================================== -->
    <div class="offcanvas offcanvas-end bg-dark text-white" tabindex="-1" id="menuOffcanvas" aria-labelledby="menuOffcanvasLabel" style="max-width: 300px;">
        <div class="offcanvas-header border-bottom border-secondary py-3">
            <h5 class="offcanvas-title fw-bold text-warning" id="menuOffcanvasLabel">Menu</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body p-3">
            <h6 class="fw-bold text-muted small text-uppercase mb-3">Data Management</h6>
            <p class="small text-white-50 mb-3">機種変更時のデータ移行時のバックアップを実施できます。</p>
            <div class="d-grid gap-2">
                <button class="btn btn-outline-light fw-bold text-start py-2.5" onclick="exportData()">📤 データを書き出す</button>
                <label class="btn btn-outline-warning fw-bold text-start mb-0 py-2.5" style="cursor: pointer;">
                    📥 データを読み込む
                    <input type="file" id="import-file" accept=".json" onchange="importData(event)" style="display:none;">
                </label>
            </div>
        </div>
    </div>


    <!-- ==========================================
    5. グラフ用全画面モーダル本体
    ========================================== -->
    <div class="modal fade" id="chartModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-fullscreen">
            <div class="modal-content border-0">
                <div class="modal-header bg-dark text-white border-0 py-3">
                    <h5 class="modal-title fw-bold" id="modal-title-text">Analytics</h5>
                    <button type="button" class="btn-close btn-close-white" onclick="closeChartModal()"></button>
                </div>
                <div class="modal-body bg-light p-3 d-flex flex-column">
                    
                    <!-- 期間切り替えタブ -->
                    <ul class="nav nav-pills nav-fill bg-white p-1 rounded-3 shadow-sm mb-2" id="periodTab">
                        <li class="nav-item">
                            <button class="nav-link active fw-bold py-2" id="btn-day" onclick="changePeriod('day')" type="button">日別</button>
                        </li>
                        <li class="nav-item">
                            <button class="nav-link fw-bold py-2" id="btn-month" onclick="changePeriod('month')" type="button">月別</button>
                        </li>
                        <li class="nav-item">
                            <button class="nav-link fw-bold py-2" id="btn-year" onclick="changePeriod('year')" type="button">年別</button>
                        </li>
                    </ul>
                    
                    <!-- 年別フィルター（月別選択時のみ自動出現） -->
                    <div id="year-filter-container" class="mb-2" style="display: none;">
                        <select id="year-select" class="form-select form-select-sm rounded-3 fw-bold text-muted" onchange="updateChart()"></select>
                    </div>
                    
                    <!-- グラフタイプ切り替えタブ -->
                    <ul class="nav nav-pills nav-fill bg-white p-1 rounded-3 mb-3 border shadow-sm" id="chartTypeTab" style="font-size: 14px;">
                        <li class="nav-item">
                            <button class="nav-link active fw-bold py-1 text-secondary" id="btn-type-line" onclick="changeChartType('line')" type="button">📈 折れ線 (最高回数)</button>
                        </li>
                        <li class="nav-item">
                            <button class="nav-link fw-bold py-1 text-secondary" id="btn-type-bar" onclick="changeChartType('bar')" type="button">📊 棒グラフ (総負荷量)</button>
                        </li>
                    </ul>
                    
                    <!-- グラフキャンバスエリア -->
                    <div class="card border-0 shadow-sm rounded-4 p-3 flex-grow-1 d-flex align-items-center justify-content-center bg-white" style="min-height: 300px;">
                        <canvas id="weightChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>


    <!-- ==========================================
    6. 重量・日付フィルター付き 全画面履歴モーダル本体
    ========================================== -->
    <div class="modal fade" id="historyModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-fullscreen">
            <div class="modal-content border-0">
                <div class="modal-header bg-dark text-white border-0 py-3">
                    <h5 class="modal-title fw-bold" id="history-modal-title-text">All History Logs</h5>
                    <button type="button" class="btn-close btn-close-white" onclick="closeHistoryModal()"></button>
                </div>
                <div class="modal-body bg-light p-3 d-flex flex-column" style="overflow-y: auto;">
                    
                    <!-- 🟢 フィルター設定カード -->
                    <div class="card border-0 shadow-sm rounded-3 p-3 mb-3 bg-white">
                        <div class="row g-2">
                            <!-- 重量絞り込みセレクトボックス -->
                            <div class="col-12 mb-1">
                                <label class="form-label small fw-bold text-muted mb-1">重量で絞り込み</label>
                                <select id="filter-weight-select" class="form-select form-select-sm rounded-2 text-muted fw-bold" onchange="filterHistoryList()">
                                    <!-- 過去に扱った重量が自動で入ります -->
                                </select>
                            </div>
                            <!-- 日付範囲カレンダー -->
                            <div class="col-6">
                                <label class="form-label small fw-bold text-muted mb-1">開始日</label>
                                <input type="date" id="filter-start-date" class="form-control form-control-sm rounded-2 text-muted" onchange="filterHistoryList()">
                            </div>
                            <div class="col-6">
                                <label class="form-label small fw-bold text-muted mb-1">終了日</label>
                                <input type="date" id="filter-end-date" class="form-control form-control-sm rounded-2 text-muted" onchange="filterHistoryList()">
                            </div>
                        </div>
                    </div>

                    <!-- 🟢 フィルターされた全履歴が並ぶコンテナ -->
                    <div id="full-history-container" class="d-flex flex-column gap-2 pb-4">
                        <!-- ここにJavaScriptで1件ずつ履歴カードが出現します -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 自作ライブラリ-->
    <script src="js/chart.js"></script>
</body>
</html>
