<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login - Workout Log PWA</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://w3.org' viewBox='0 0 512 512' width='512' height='512'><rect width='512' height='512' rx='100' fill='%23ff5722'/><circle cx='256' cy='256' r='120' fill='%23ffffff'/><rect x='206' y='206' width='100' height='100' fill='%23ff5722'/></svg>">
    
    <!-- CSSファイルの読み込み -->
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <div class="container">
        <div class="card">
            <h1>Workout Log PWA</h1>
            <p>パスワードを入力してください</p>
            <input type="password" id="password-input" placeholder="パスワードを入力">
            <button class="btn-primary" onclick="tryLogin()">ログイン</button>
        </div>
    </div>

    <!-- JavaScriptファイルの読み込み -->
    <script src="js/auth.js"></script>
    <script>
        // PWA サービスワーカー登録
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => console.error(err));
        }
    </script>
</body>
</html>
